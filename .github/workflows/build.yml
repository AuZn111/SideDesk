name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build
        run: dotnet build SideDesk.sln -c Release --nologo

      - name: Publish portable package
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1 -SkipZip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideDesk-win-x64
          path: dist/
